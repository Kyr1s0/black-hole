<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Black Hole Project</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* ФОНОВОЕ ВИДЕО */

#blackhole {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    width: 100vw;
    height: 100vh;

    object-fit: cover;
    object-position: center;

    z-index: 0;

    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
}

/* ПОДДЕРЖКА МОБИЛЬНОГО ЭКРАНА */

@supports (height: 100dvh) {
    #blackhole {
        height: 100dvh;
    }
}

/* КНОПКА ЗВУКА */

.sound-button {
    position: fixed;

    bottom: max(30px, env(safe-area-inset-bottom));
    right: max(30px, env(safe-area-inset-right));

    width: 55px;
    height: 55px;

    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 50%;

    background: rgba(10,10,15,0.65);
    color: white;

    font-size: 23px;
    cursor: pointer;

    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);

    transition: 0.3s;

    z-index: 10;
}

.sound-button:active {
    transform: scale(0.94);
}

@media (hover: hover) {
    .sound-button:hover {
        background: rgba(255,255,255,0.2);
        transform: scale(1.08);
    }
}

/* ЗАСТАВКА ПОВОРОТА ТЕЛЕФОНА */

.rotate-screen {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    background:
        radial-gradient(
            circle at center,
            #17100b 0%,
            #08090e 45%,
            #000 100%
        );

    display: none;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 35px;

    z-index: 1000;
}

/* ПОКАЗЫВАЕМ В ВЕРТИКАЛЬНОМ РЕЖИМЕ */

@media screen and (max-width: 900px) and (orientation: portrait) {

    .rotate-screen {
        display: flex;
    }

    .sound-button {
        display: none;
    }

}

/* ИКОНКА ТЕЛЕФОНА */

.phone-icon {
    width: 75px;
    height: 125px;

    border: 3px solid #d9aa62;
    border-radius: 13px;

    position: relative;

    box-shadow:
        0 0 20px rgba(217,170,98,0.3);

    animation: rotatePhone 2.5s ease-in-out infinite;
}

.phone-icon::before {
    content: "";

    position: absolute;

    top: 7px;
    left: 50%;

    transform: translateX(-50%);

    width: 22px;
    height: 3px;

    border-radius: 5px;

    background: #d9aa62;
}

.phone-icon::after {
    content: "";

    position: absolute;

    bottom: 7px;
    left: 50%;

    transform: translateX(-50%);

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #d9aa62;
}

@keyframes rotatePhone {

    0%, 20% {
        transform: rotate(0deg);
    }

    60%, 80% {
        transform: rotate(90deg);
    }

    100% {
        transform: rotate(90deg);
    }

}

/* НАДПИСИ */

.rotate-title {
    color: #e7c18c;

    font-size: 17px;
    letter-spacing: 3px;

    text-align: center;

    line-height: 1.7;

    text-shadow:
        0 0 15px rgba(217,170,98,0.4);
}

.rotate-subtitle {
    color: rgba(255,255,255,0.55);

    font-size: 12px;
    letter-spacing: 2px;

    text-align: center;
}

</style>
</head>

<body>

<!-- ЗАСТАВКА -->

<div class="rotate-screen" id="rotateScreen">

    <div class="phone-icon"></div>

    <div class="rotate-title">
        ПОВЕРНИТЕ УСТРОЙСТВО<br>
        ГОРИЗОНТАЛЬНО
    </div>

    <div class="rotate-subtitle">
        BLACK HOLE PROJECT
    </div>

</div>

<!-- ЧЁРНАЯ ДЫРА -->

<video
    id="blackhole"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    disablepictureinpicture
    preload="auto"
    tabindex="-1"
>
    <source src="blackhole.mp4" type="video/mp4">
</video>

<!-- МУЗЫКА -->

<audio id="backgroundSound" preload="auto"></audio>

<!-- КНОПКА ЗВУКА -->

<button
    class="sound-button"
    id="soundButton"
    type="button"
    onclick="toggleSound()"
    aria-label="Включить звук"
>
    🔇
</button>

<script>

/* ВИДЕО */

const video = document.getElementById("blackhole");

video.muted = true;
video.loop = true;
video.controls = false;

function startVideo() {

    video.play().catch(error => {
        console.log("Видео ожидает разрешения браузера:", error);
    });

}

startVideo();

/* МУЗЫКАЛЬНЫЕ ДОРОЖКИ */

const tracks = [
    "sound1.mp3",
    "sound2.mp3",
    "sound3.mp3"
];

const sound = document.getElementById("backgroundSound");

const button = document.getElementById("soundButton");

let soundEnabled = false;
let currentTrack = "";
let isStarting = false;

/* СЛУЧАЙНЫЙ ВЫБОР */

function getRandomTrack() {

    const availableTracks = tracks.filter(
        track => track !== currentTrack
    );

    const randomIndex = Math.floor(
        Math.random() * availableTracks.length
    );

    currentTrack = availableTracks[randomIndex];

    return currentTrack;

}

/* СЛЕДУЮЩАЯ ДОРОЖКА */

async function playNextTrack() {

    if (!soundEnabled || isStarting) return;

    isStarting = true;

    sound.pause();

    sound.src = getRandomTrack();

    sound.load();

    try {

        await sound.play();

        console.log("Сейчас играет:", currentTrack);

    } catch (error) {

        console.log("Ошибка музыки:", error);

    } finally {

        isStarting = false;

    }

}

/* КОНЕЦ ДОРОЖКИ */

sound.addEventListener("ended", () => {

    if (soundEnabled) {
        playNextTrack();
    }

});

/* КНОПКА ЗВУКА */

async function toggleSound() {

    if (!soundEnabled) {

        soundEnabled = true;

        button.textContent = "🔊";

        button.setAttribute(
            "aria-label",
            "Выключить звук"
        );

        await playNextTrack();

    } else {

        soundEnabled = false;

        sound.pause();

        button.textContent = "🔇";

        button.setAttribute(
            "aria-label",
            "Включить звук"
        );

    }

}

/* ПОВТОРНАЯ ПОПЫТКА ЗАПУСКА ВИДЕО */

document.addEventListener("visibilitychange", () => {

    if (!document.hidden && video.paused) {
        startVideo();
    }

});

</script>

</body>
</html>
